version: '3'

x-node-environment: &node-environment
  EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://host.docker.internal:1234/v1}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-lm-studio}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-ai/nomic-embed-text-v1.5-GGUF}

services:
  container_1:
    image: chord_test
    container_name: node_1
    environment: *node-environment
    volumes:
      - ${PWD}/distributed:/app/code
      - ${PWD}/logs/container_1:/app/logs
      - ${PWD}/databases/container_1:/app/database
    command: /bin/bash
    tty: true
    stdin_open: true
